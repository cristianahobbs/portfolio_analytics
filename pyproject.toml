[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-analytics"
version = "0.1.0"
description = "Multi-asset portfolio risk, performance and optimisation analytics"
requires-python = ">=3.10"
dependencies = [
    "numpy", "pandas>=2.2", "scipy", "scikit-learn", "arch",
    "yfinance", "pyyaml", "pyarrow", "plotly", "streamlit",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
